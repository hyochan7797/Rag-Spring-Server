name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  SPRING_IMAGE: ghcr.io/hyochan7797/rag-spring

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test Spring
        working-directory: java
        run: |
          chmod +x gradlew
          ./gradlew test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Spring image
        uses: docker/build-push-action@v6
        with:
          context: ./java
          push: true
          tags: |
            ${{ env.SPRING_IMAGE }}:latest
            ${{ env.SPRING_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=spring
          cache-to: type=gha,scope=spring,mode=max

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e
            cd ~/rag
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u hyochan7797 --password-stdin
            docker compose -f docker-compose.spring-aws.yml pull
            docker compose -f docker-compose.spring-aws.yml up -d
            docker compose -f docker-compose.spring-aws.yml ps
