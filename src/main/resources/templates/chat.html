<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AI 금융 챗봇</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            margin: 0;
        }
        .chat-container {
            width: 600px;
            height: 700px;
            background: white;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            padding-top: 50px;
        }
        .logout-button {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 8px 12px;
            border: none;
            background: #dc3545;
            color: white;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
            z-index: 10;
        }
        .logout-button:hover {
            background: #c82333;
        }
        .chat-box {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
            border-bottom: 1px solid #ccc;
        }
        .chat-input {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ccc;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            padding: 12px 15px;
            border: none;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin-left: 10px;
        }
        button:hover {
            background: #0056b3;
        }
        .user-message {
            text-align: right;
            background-color: #cce5ff;
            color: #003366;
            padding: 10px;
            border-radius: 10px;
            margin-left: auto;
            margin-bottom: 16px;
            max-width: 75%;
            display: block;   /* ✅ */
            clear: both;      /* ✅ */
        }

        .bot-message {
            text-align: left;
            background-color: #f1f1f1;
            color: #222;
            padding: 10px;
            border-radius: 10px;
            margin-right: auto;
            margin-bottom: 16px;
            max-width: 75%;
            display: block;   /* ✅ */
            clear: both;      /* ✅ */
        }
    </style>
</head>
<body>

<div class="chat-container">
    <button class="logout-button" onclick="logout()">로그아웃</button>
    <div class="chat-box" id="chatBox"></div>
    <div class="chat-input">
        <input type="text" id="messageInput" placeholder="메시지를 입력하세요..." autocomplete="off"/>
        <button id="sendButton">전송</button>
    </div>
</div>

<script>
    const input = document.getElementById("messageInput");
    const chatBox = document.getElementById("chatBox");
    const sendButton = document.getElementById("sendButton");
    let sending = false;

    function sendMessage() {
        if (sending) return;
        sending = true;

        const message = input.value.trim();
        if (!message) {
            sending = false;
            return;
        }

        chatBox.innerHTML += `<div class="user-message"><strong>나:</strong> ${message}</div>`;
        input.value = "";

        fetch("/api/ask", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "include",
            body: JSON.stringify({ question: message })
        })
            .then(response => {
                if (!response.ok) throw new Error("서버 응답 오류");
                return response.json();
            })
            .then(data => {
                if (data.answer) {
                    chatBox.innerHTML += `<div class="bot-message"><strong>챗봇:</strong> ${data.answer.replace(/\n/g, "<br>")}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="bot-message" style="color:red;"><strong>오류:</strong> 챗봇 응답 없음</div>`;
                }
                chatBox.scrollTop = chatBox.scrollHeight;
            })
            .catch(error => {
                console.error("Error:", error);
                chatBox.innerHTML += `<div class="bot-message" style="color:red;"><strong>오류:</strong> 서버 통신 실패</div>`;
            })
            .finally(() => {
                sending = false;
            });
    }

    // Enter 키 이벤트 (중복 방지)
    input.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();  // Enter 기본 동작 막기
            sendMessage();
        }
    });

    sendButton.addEventListener("click", sendMessage);

    function logout() {
        fetch("/logout", {
            method: "POST",
            credentials: "include"
        })
            .then(response => {
                if (response.ok) {
                    window.location.href = "/login";
                } else {
                    alert("로그아웃 실패");
                }
            })
            .catch(error => console.error("Logout error:", error));
    }
</script>

</body>
</html>
