services:
  finance-mysql:
    image: mysql:8
    container_name: finance-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  fastapi:
    build:
      context: ./python
    container_name: fastapi-app
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./python/.env
    environment:
      QDRANT_URL: http://qdrant:6333
      COLLECTION_NAME: ${COLLECTION_NAME:-loan_docs}
      HF_HOME: /root/.cache/huggingface
    depends_on:
      finance-mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./python/app/data:/app/data
      - hf_cache:/root/.cache/huggingface

  spring:
    build:
      context: ./java
    container_name: spring-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://finance-mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      FASTAPI_URL: http://fastapi:8000/chat
      FASTAPI_ADMIN_URL: http://fastapi:8000/admin/refresh
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      LOAN_REFRESH_CRON: ${LOAN_REFRESH_CRON:-0 0 2 * * *}
    depends_on:
      finance-mysql:
        condition: service_healthy
      fastapi:
        condition: service_started

volumes:
  mysql_data:
  qdrant_storage:
  hf_cache:
