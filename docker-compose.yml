services:
  finance-mysql:
    image: mysql:8
    container_name: finance-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  spring:
    build:
      context: ./java
    container_name: spring-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://finance-mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      FASTAPI_URL: ${FASTAPI_URL:-http://host.docker.internal:8000/chat}
      FASTAPI_ADMIN_URL: ${FASTAPI_ADMIN_URL:-http://host.docker.internal:8000/admin/refresh}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      LOAN_REFRESH_CRON: ${LOAN_REFRESH_CRON:--}
      LOAN_REFRESH_ZONE: Asia/Seoul
      TZ: Asia/Seoul
    depends_on:
      finance-mysql:
        condition: service_healthy

volumes:
  mysql_data:
