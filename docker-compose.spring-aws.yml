services:
  finance-mysql:
    image: mysql:8
    container_name: finance-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  spring:
    image: ${SPRING_IMAGE:-ghcr.io/hyochan7797/rag-spring:latest}
    container_name: spring-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://finance-mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      FASTAPI_URL: ${FASTAPI_URL:-http://localhost:8000/chat}
      FASTAPI_ADMIN_URL: ${FASTAPI_ADMIN_URL:-http://localhost:8000/admin/refresh}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      LOAN_REFRESH_CRON: ${LOAN_REFRESH_CRON:--}
      LOAN_REFRESH_ZONE: Asia/Seoul
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -Duser.timezone=Asia/Seoul"
      TZ: Asia/Seoul
    depends_on:
      finance-mysql:
        condition: service_healthy

volumes:
  mysql_data:
