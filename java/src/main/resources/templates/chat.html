<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 금융 챗봇</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            margin: 0;
        }

        .chat-container {
            width: min(600px, calc(100vw - 24px));
            height: min(700px, calc(100vh - 24px));
            background: white;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            padding-top: 50px;
        }

        .logout-button {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 8px 12px;
            border: none;
            background: #dc3545;
            color: white;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
            z-index: 10;
        }

        .logout-button:hover {
            background: #c82333;
        }

        .chat-box {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
            border-bottom: 1px solid #ccc;
        }

        .chat-input {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ccc;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            padding: 12px 15px;
            border: none;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin-left: 10px;
        }

        button:hover {
            background: #0056b3;
        }

        .user-message,
        .bot-message,
        .loading-message {
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 16px;
            max-width: 75%;
            display: block;
            clear: both;
            line-height: 1.45;
            word-break: break-word;
        }

        .user-message {
            text-align: right;
            background-color: #cce5ff;
            color: #003366;
            margin-left: auto;
        }

        .bot-message,
        .loading-message {
            text-align: left;
            background-color: #f1f1f1;
            color: #222;
            margin-right: auto;
        }

        .loading-message {
            display: none;
            background-color: #eef3ff;
            color: #1f2a44;
            min-width: 190px;
        }

        .thinking {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .thinking-orbit {
            position: relative;
            width: 28px;
            height: 28px;
            flex: 0 0 28px;
            border: 2px solid #c7d7ff;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        .thinking-orbit::after {
            content: "";
            position: absolute;
            inset: 8px;
            background: #2563eb;
            border-radius: 50%;
            animation: pulse 1.2s ease-in-out infinite;
        }

        .thinking-text {
            display: flex;
            align-items: baseline;
            gap: 2px;
            font-weight: 600;
        }

        .loading-dots span {
            display: inline-block;
            animation: bounce 1.1s infinite ease-in-out;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.45;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.1);
            }
        }

        @keyframes bounce {
            0%, 80%, 100% {
                opacity: 0.35;
                transform: translateY(0);
            }
            40% {
                opacity: 1;
                transform: translateY(-4px);
            }
        }

        #sendButton:disabled {
            background: #8aa7d8;
            cursor: wait;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <button class="logout-button" onclick="logout()">로그아웃</button>
    <div class="chat-box" id="chatBox">
        <div id="loadingMessage" class="loading-message">
            <div class="thinking" aria-live="polite">
                <span class="thinking-orbit" aria-hidden="true"></span>
                <span class="thinking-text">
                    <strong>AI가 생각 중</strong>
                    <span class="loading-dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span>
                </span>
            </div>
        </div>
    </div>
    <div class="chat-input">
        <input type="text" id="messageInput" placeholder="메시지를 입력하세요." autocomplete="off" />
        <button id="sendButton">전송</button>
    </div>
</div>

<script>
    const input = document.getElementById("messageInput");
    const chatBox = document.getElementById("chatBox");
    const sendButton = document.getElementById("sendButton");
    const loadingMessage = document.getElementById("loadingMessage");
    let sending = false;

    const GREETING_MESSAGE = `
안녕하세요. 대출 AI 챗봇입니다. 필요한 대출에 대해 질문해주세요.

참고: 주요 은행 지점을 확인하려면 아래처럼 질문해주세요.
"근처 국민은행 알려줘", "근처 하나은행 알려줘", "근처 우리은행 알려줘"
`.trim().replace(/\n/g, "<br>");

    window.onload = function() {
        chatBox.innerHTML += `<div class="bot-message"><strong>챗봇:</strong> ${GREETING_MESSAGE}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    };

    function sendMessage() {
        if (sending) return;

        const message = input.value.trim();
        if (!message) return;

        sending = true;
        sendButton.disabled = true;
        chatBox.innerHTML += `<div class="user-message"><strong>나:</strong> ${escapeHtml(message)}</div>`;
        input.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        loadingMessage.style.display = "block";
        chatBox.scrollTop = chatBox.scrollHeight;

        fetch("/api/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ question: message })
        })
            .then(response => {
                if (!response.ok) throw new Error("서버 응답 오류");
                return response.json();
            })
            .then(data => {
                if (data.answer) {
                    chatBox.innerHTML += `<div class="bot-message"><strong>챗봇:</strong> ${data.answer.replace(/\n/g, "<br>")}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="bot-message" style="color:red;"><strong>오류:</strong> 챗봇 응답이 없습니다.</div>`;
                }
                chatBox.scrollTop = chatBox.scrollHeight;
            })
            .catch(error => {
                console.error("Error:", error);
                chatBox.innerHTML += `<div class="bot-message" style="color:red;"><strong>오류:</strong> 서버 통신에 실패했습니다.</div>`;
            })
            .finally(() => {
                loadingMessage.style.display = "none";
                sending = false;
                sendButton.disabled = false;
                chatBox.scrollTop = chatBox.scrollHeight;
            });
    }

    function escapeHtml(value) {
        return value
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    input.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            sendMessage();
        }
    });

    sendButton.addEventListener("click", sendMessage);

    function logout() {
        fetch("/logout", { method: "POST", credentials: "include" })
            .then(response => {
                if (response.ok) window.location.href = "/login";
                else alert("로그아웃에 실패했습니다.");
            })
            .catch(error => console.error("Logout error:", error));
    }
</script>

</body>
</html>
