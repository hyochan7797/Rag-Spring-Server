spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/finance_db}
    username: ${SPRING_DATASOURCE_USERNAME:app_user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: ${HIBERNATE_SHOW_SQL:true}

  batch:
    jdbc:
      initialize-schema: ${SPRING_BATCH_JDBC_INITIALIZE_SCHEMA:always}
    job:
      enabled: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

fastapi:
  chat:
    url: ${FASTAPI_URL:http://localhost:8000/chat}
  admin:
    url: ${FASTAPI_ADMIN_URL:http://localhost:8000/admin/refresh}
    connect-timeout: ${FASTAPI_ADMIN_CONNECT_TIMEOUT:5s}
    read-timeout: ${FASTAPI_ADMIN_READ_TIMEOUT:10m}

loan-refresh:
  cron: ${LOAN_REFRESH_CRON:0 0 2 * * *}
  zone: ${LOAN_REFRESH_ZONE:Asia/Seoul}
