version: '3.9'

services:
  finance-mysql:
    image: mysql:8
    container_name: finance-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: finance_db
      MYSQL_USER: hyochan
      MYSQL_PASSWORD: 131890
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  fastapi:
    build:
      context: /Users/hyochan/Desktop/Project/rag/python
    container_name: fastapi-app
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MYSQL_HOST: finance-mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: finance_db
      MYSQL_USER: hyochan
      MYSQL_PASSWORD: 131890
      QDRANT_URL: http://qdrant:6333
      COLLECTION_NAME: loan_docs
      HF_HOME: /root/.cache/huggingface
    depends_on:
      finance-mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - /Users/hyochan/Desktop/Project/rag/python/app/data:/app/data
      - /Users/hyochan/Desktop/Project/rag/python/hf_cache:/root/.cache/huggingface


  spring:
    build:
      context: /Users/hyochan/Desktop/Project/rag/java
    container_name: spring-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://finance-mysql:3306/finance_db
      SPRING_DATASOURCE_USERNAME: hyochan
      SPRING_DATASOURCE_PASSWORD: 131890
      FASTAPI_URL: http://fastapi:8000/chat
    depends_on:
      finance-mysql:
        condition: service_healthy
      fastapi:
        condition: service_started

volumes:
  mysql_data:
  qdrant_storage:
